name: Test exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run conflibot action with exclude patterns
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          exclude: |
            *.lock
            vendor/**
            dist/**
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail gracefully when not in a PR context.
          # We accept both 'success' and 'failure' (graceful non-PR handling),
          # but NOT a crash/infrastructure error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected for non-PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
