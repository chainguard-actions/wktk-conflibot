name: Test with exclude patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run conflibot action with exclude patterns
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          exclude: |
            *.lock
            vendor/**
            dist/**
        continue-on-error: true
      - name: Assert action ran with exclude input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR context, so the action may
          # succeed (no-op) or fail gracefully. Either way it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with exclude patterns, outcome=$OUTCOME"
