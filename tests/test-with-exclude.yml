name: Test with exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run conflibot action with exclude patterns
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          exclude: |
            *.lock
            vendor/**
            node_modules/**
        continue-on-error: true
      - name: Assert action ran with exclude input (completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with exclude input"
          else
            echo "FAIL: action did not run properly, outcome=$OUTCOME"
            exit 1
          fi
