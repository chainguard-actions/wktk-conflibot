name: Test basic usage - non-PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request context to function.
      # Under workflow_dispatch (act), github.context.payload.pull_request is
      # undefined, so the action will fail with "The pull request is undefined."
      # We verify the action exits non-zero (expected) and does NOT crash the
      # runner in an unexpected way.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed as expected in non-PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in non-PR context, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when run outside a pull_request context"
