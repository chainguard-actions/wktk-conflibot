name: Test basic usage - no PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is designed to run on pull_request events and reads
      # github.context.payload.pull_request. Under workflow_dispatch (act),
      # there is no PR payload, so the action will fail with an error caught
      # by its own try/catch. We verify it runs and fails gracefully (not a
      # runner crash), and that the github-token input is accepted.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran and failed gracefully (no PR context expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no pull_request context
          # under workflow_dispatch. A 'failure' outcome means it ran and
          # exited non-zero — which is the expected behavior here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no PR context under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (possibly no open PRs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
