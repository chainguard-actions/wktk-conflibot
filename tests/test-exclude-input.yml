name: Test exclude input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the 'exclude' input (newline-separated glob patterns) is
      # accepted and parsed by the action without crashing during initialization.
      # The action will still fail due to no PR context under workflow_dispatch,
      # but the failure should be a graceful API error, not an input-parsing crash.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          exclude: |
            docs/**
            *.md
            tests/**
        continue-on-error: true

      - name: Assert action ran with exclude input (graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no pull_request context
          # under workflow_dispatch. A 'failure' outcome means it ran and
          # exited non-zero — which is the expected behavior here.
          # What we're verifying is that the exclude input did NOT cause a
          # crash during parsing (which would also show as 'failure', but
          # the action logs would show an input error rather than an API error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with exclude input provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (possibly no open PRs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
