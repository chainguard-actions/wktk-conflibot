name: Test exclude patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          exclude: |
            *.lock
            vendor/**
            node_modules/**
          fail-on-conflict: 'false'
          max-retries: '1'
          retry-interval: '1'
        continue-on-error: true
      - name: Assert action accepted exclude patterns and ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONFLICTS: ${{ steps.action.outputs.conflicts }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "conflicts output: $CONFLICTS"
          # Under workflow_dispatch (not a pull_request event), the action will
          # fail because github.context.payload.pull_request is undefined.
          # This is expected — the action is designed for PR events only.
          # The important thing is that the action accepted the exclude patterns
          # and ran (did not crash on input parsing).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with exclude patterns and failed as expected (no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONFLICTS" ]; then
              echo "PASS: action succeeded with empty conflicts output"
            else
              echo "$CONFLICTS" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list)" && echo "PASS: conflicts is a valid JSON array" || { echo "FAIL: conflicts is not a valid JSON array"; exit 1; }
            fi
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
